<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwik playground — browser-only proof of concept</title>
    <style>
      :root {
        --bg: #11131a;
        --panel: #1a1d27;
        --panel-alt: #222634;
        --border: #2e3344;
        --text: #e6e8ef;
        --muted: #8b93a7;
        --accent: #18b6f6;
        --error: #ff6b6b;
        --warn: #ffc857;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      header .brand {
        font-weight: 600;
      }

      header .brand span {
        color: var(--accent);
      }

      header .meta {
        color: var(--muted);
        font-size: 12px;
      }

      header .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
      }

      header .status.ready .dot {
        background: #35d07f;
      }

      header .status.failed .dot {
        background: var(--error);
      }

      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        }
      }

      .pane {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .pane + .pane {
        border-left: 1px solid var(--border);
      }

      .pane-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
        color: var(--muted);
      }

      .pane-header .spacer {
        flex: 1;
      }

      button {
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #061019;
        font-weight: 600;
      }

      button.icon {
        padding: 2px 7px;
        line-height: 1.2;
      }

      .tabs {
        display: flex;
        gap: 4px;
      }

      .tabs button.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      .files {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        max-height: 38%;
        overflow: auto;
      }

      .file {
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 5px;
      }

      .file.active {
        background: var(--panel-alt);
      }

      .file input.entry {
        accent-color: var(--accent);
        margin: 0 2px;
        cursor: pointer;
      }

      .file input.path {
        flex: 1;
        min-width: 0;
        padding: 3px 5px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .file.active input.path {
        color: var(--accent);
      }

      .file.invalid input.path {
        color: var(--error);
      }

      .file input.path:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--bg);
      }

      .add-file {
        align-self: flex-start;
        margin-top: 4px;
      }

      textarea {
        flex: 1;
        min-height: 0;
        width: 100%;
        resize: none;
        border: 0;
        outline: none;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        tab-size: 2;
      }

      .tab-panel {
        flex: 1;
        min-height: 0;
        display: none;
      }

      .tab-panel.active {
        display: flex;
      }

      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
      }

      pre {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 14px;
        overflow: auto;
        font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
      }

      footer {
        height: 28%;
        max-height: 240px;
        min-height: 92px;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }

      footer .console-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }

      #console {
        flex: 1;
        overflow: auto;
        padding: 8px 12px;
        font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #console .entry {
        display: flex;
        gap: 8px;
        padding: 2px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        white-space: pre-wrap;
        word-break: break-word;
      }

      #console .tag {
        flex: none;
        width: 52px;
        color: var(--muted);
      }

      #console .error .tag,
      #console .error .text {
        color: var(--error);
      }

      #console .warn .tag,
      #console .warn .text {
        color: var(--warn);
      }

      #console .info .tag {
        color: var(--accent);
      }

      #console .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Qwik <span>playground</span></div>
      <div class="meta">proof of concept · compiled in the browser · no server</div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">loading compiler…</span></div>
    </header>

    <main>
      <section class="pane">
        <div class="pane-header">
          <span>Project</span>
          <span class="spacer"></span>
          <span>ctrl/cmd + enter</span>
          <button class="primary" id="run">Run</button>
        </div>
        <div class="files" id="files"></div>
        <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
      </section>

      <section class="pane">
        <div class="pane-header">
          <div class="tabs">
            <button data-tab="result" class="active">Result</button>
            <button data-tab="compiled">Compiled JS</button>
          </div>
        </div>
        <div class="tab-panel active" data-panel="result">
          <iframe
            id="result"
            title="Qwik result"
            sandbox="allow-scripts allow-modals allow-popups allow-forms"
          ></iframe>
        </div>
        <div class="tab-panel" data-panel="compiled">
          <pre id="compiled"></pre>
        </div>
      </section>
    </main>

    <footer>
      <div class="console-head">
        <span>Console</span>
        <span class="spacer"></span>
        <button id="clear">Clear</button>
      </div>
      <div id="console"><div class="empty">no output</div></div>
    </footer>

    <script type="module">
      /* ===================================================================
       * 1. Configuration
       * -------------------------------------------------------------------
       * The Qwik compiler *and* the Qwik runtime are loaded straight from a
       * CDN and run in the browser. Nothing is compiled or rendered on a
       * server.
       * ================================================================= */

      const QWIK_VERSION = '1.15.0';
      const cdnBaseUrl = 'https://cdn.jsdelivr.net/npm/@builder.io/qwik@' + QWIK_VERSION;

      /**
       * `@builder.io/qwik` and `@builder.io/qwik/jsx-runtime` resolve to the *same*
       * file (the package maps both to `dist/core.prod.mjs`). Keeping one URL means
       * one module instance — Qwik keeps module-level state that must not be
       * duplicated, otherwise signals/containers from the two copies don't match.
       *
       * These are the only bare specifiers that exist at runtime. Every relative
       * import between project files is rewritten to a data: URL before it gets
       * here, so no user module ever needs an import-map entry.
       */
      const importMap = {
        imports: {
          '@builder.io/qwik': cdnBaseUrl + '/dist/core.prod.mjs',
          '@builder.io/qwik/jsx-runtime': cdnBaseUrl + '/dist/core.prod.mjs',
          '@builder.io/qwik/build': cdnBaseUrl + '/dist/build/index.prod.mjs',
          '@builder.io/qwik/preloader': cdnBaseUrl + '/dist/preloader.mjs',
        },
      };

      /* ===================================================================
       * 2. Compiler — the Qwik optimizer (Rust → WASM), running in-browser
       * -------------------------------------------------------------------
       * The optimizer is what turns `component$`, `onClick$`, ... into QRLs.
       * It ships as a wasm module plus a small JS glue file. Note `bindings/*`
       * is NOT declared in the package `exports` map, so it has to be fetched
       * by URL rather than imported as a package subpath.
       * ================================================================= */

      const wasmGlueUrl = cdnBaseUrl + '/bindings/qwik.wasm.mjs';
      const wasmBinaryUrl = cdnBaseUrl + '/bindings/qwik_wasm_bg.wasm';

      /**
       * Qwik does not attach per-element DOM listeners. The renderer records the
       * handlers on the element context (`element._qc_.li`) and publishes the used
       * event names on `window.qwikevents`; a single global delegate — the
       * "qwikloader" — reads both and dispatches. Without it nothing is clickable.
       */
      const qwikLoaderUrl = cdnBaseUrl + '/dist/qwikloader.js';

      /**
       * Mirrors `convertOptions()` from `dist/optimizer.mjs` so the raw wasm
       * binding can be called directly and we skip the optimizer's Node/Deno/Bun
       * platform detection entirely.
       */
      const convertOptions = (options) => {
        const output = {
          minify: 'simplify',
          sourceMaps: false,
          transpileTs: false,
          transpileJsx: false,
          preserveFilenames: false,
          explicitExtensions: false,
          mode: 'lib',
          manualChunks: undefined,
          scope: undefined,
          regCtxName: undefined,
          stripEventHandlers: false,
          rootDir: undefined,
          stripExports: undefined,
          stripCtxName: undefined,
          isServer: undefined,
        };
        for (const [key, value] of Object.entries(options)) {
          if (value != null) output[key] = value;
        }
        output.entryStrategy = options.entryStrategy?.type ?? 'smart';
        output.manualChunks = options.entryStrategy?.manual ?? undefined;
        return output;
      };

      let optimizerPromise;

      const loadOptimizer = () => {
        optimizerPromise ??= (async () => {
          const binding = await import(wasmGlueUrl);
          await binding.default({ module_or_path: wasmBinaryUrl });
          return binding;
        })();
        return optimizerPromise;
      };

      const formatDiagnostic = (diagnostic) => {
        const highlight = diagnostic.highlights?.[0];
        const where = highlight ? highlight.startLine + ':' + highlight.startCol : '';
        const scope = diagnostic.scope === 'optimizer' ? '' : diagnostic.scope;
        return (where ? where + ' ' : '') + (scope ? '[' + scope + '] ' : '') + diagnostic.message;
      };

      /* ===================================================================
       * 3. Module linking — resolving relative imports without a server
       * -------------------------------------------------------------------
       * The optimizer rewrites `$` closures but never bundles modules: with N
       * input files it emits N (or more) modules that still import each other by
       * relative path. Something has to resolve those.
       *
       * There is no server to serve them and, as in LiveCodes, blob URLs are not
       * an option: the compiler and the result page live in different origins, so
       * the compiler cannot mint a URL the result page can fetch. The one URL
       * form that works everywhere is a `data:` URL — which is exactly what
       * LiveCodes' `replaceSFCImports` uses for nested Vue/Svelte components.
       *
       * So: walk the module graph from the entry, and rewrite every relative
       * specifier into the data: URL of the module it resolves to. Because a
       * parent embeds its children, links must be built bottom-up, which means
       * the graph has to be acyclic.
       * ================================================================= */

      const toDataUrl = (content, type = 'text/javascript') => {
        const bytes = new TextEncoder().encode(content);
        let binary = '';
        const chunkSize = 0x8000;
        for (let index = 0; index < bytes.length; index += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
        }
        return 'data:' + type + ';charset=UTF-8;base64,' + btoa(binary);
      };

      // `import … from 'x'`, `export … from 'x'`, `import 'x'`
      const staticImportPattern = /(\bfrom\s*|\bimport\s*)(["'])([^"'\n]+)\2/g;
      // `import('x')`
      const dynamicImportPattern = /(\bimport\s*\(\s*)(["'])([^"'\n]+)\2/g;

      /**
       * Rewrites every quoted module specifier for which `mapSpecifier` returns a
       * replacement. Returning `null` leaves the statement untouched. Dynamic
       * imports are handled first and counted, since they are Qwik's lazy
       * boundaries.
       */
      const rewriteSpecifiers = (code, mapSpecifier) => {
        let lazy = 0;
        const replace = (dynamic) => (match, prefix, quote, specifier) => {
          const replacement = mapSpecifier(specifier, dynamic);
          if (replacement == null) return match;
          if (dynamic) lazy++;
          return prefix + quote + replacement + quote;
        };
        const withDynamic = code.replace(dynamicImportPattern, replace(true));
        const withStatic = withDynamic.replace(staticImportPattern, replace(false));
        return { code: withStatic, lazy };
      };

      const SOURCE_EXTENSIONS = ['.js', '.jsx', '.ts', '.tsx'];

      /**
       * The optimizer names its generated chunks after the file they came from
       * (`src/counter.tsx_Counter_component_9bHJINVHHaU.js`) and copies the file's
       * relative imports into them, so a resolution failure is usually reported
       * against a chunk. Map that back to the file the user actually wrote.
       */
      const moduleOwner = (modulePath) => {
        const match = modulePath.match(/^(.*\.(?:tsx|ts|jsx|js))_[^/]*$/);
        return match ? match[1] : modulePath;
      };

      const normalizePath = (path) => {
        const segments = [];
        for (const segment of path.split('/')) {
          if (segment === '' || segment === '.') continue;
          if (segment === '..') segments.pop();
          else segments.push(segment);
        }
        return segments.join('/');
      };

      const dirname = (path) => path.slice(0, path.lastIndexOf('/'));

      /**
       * Resolves a relative specifier against the modules the optimizer emitted.
       * Extensionless specifiers are the norm, and the optimizer renames `.tsx`
       * inputs to `.js` outputs, so both forms have to be tried.
       */
      const resolveRelative = (fromPath, specifier, modulesByPath) => {
        const base = normalizePath(dirname(fromPath) + '/' + specifier);
        const candidates = [
          base,
          ...SOURCE_EXTENSIONS.map((extension) => base + extension),
          base.replace(/\.(tsx|ts|jsx)$/, '.js'),
          ...SOURCE_EXTENSIONS.map((extension) => base + '/index' + extension),
        ];
        return candidates.find((candidate) => modulesByPath.has(candidate));
      };

      /**
       * Links the emitted modules starting from the entry, returning a single
       * self-contained entry module plus a report of what resolved to what.
       */
      const linkModules = (modules, entryPath) => {
        const modulesByPath = new Map(modules.map((module) => [module.path, module]));
        const linked = new Map();
        const report = new Map();
        const resolving = [];
        let lazy = 0;

        const link = (path) => {
          const cached = linked.get(path);
          if (cached != null) return cached;
          if (resolving.includes(path)) {
            throw new Error('Circular import: ' + [...resolving, path].join(' → '));
          }
          const module = modulesByPath.get(path);
          if (!module) throw new Error('The compiler did not emit a module for ' + path);

          resolving.push(path);
          const resolutions = [];
          const mapSpecifier = (specifier) => {
            if (!specifier.startsWith('.')) {
              if (specifier in importMap.imports) return null;
              throw new Error(
                'Cannot resolve "' + specifier + '" imported by ' + moduleOwner(path) +
                  ' — only relative files and the Qwik runtime are available.',
              );
            }
            const target = resolveRelative(path, specifier, modulesByPath);
            if (!target) {
              throw new Error('Cannot resolve "' + specifier + '" imported by ' + moduleOwner(path));
            }
            resolutions.push({ specifier, target });
            return toDataUrl(link(target));
          };

          const rewritten = rewriteSpecifiers(module.code, mapSpecifier);
          lazy += rewritten.lazy;
          resolving.pop();
          linked.set(path, rewritten.code);
          report.set(path, resolutions);
          return rewritten.code;
        };

        const entryCode = link(entryPath);
        return { entryCode, report, moduleCount: linked.size, lazy };
      };

      /* ===================================================================
       * 4. Project compilation
       * ================================================================= */

      /** The optimizer emits `.js` for every input, whatever it was written as. */
      const toModulePath = (inputPath) => inputPath.replace(/\.(tsx|ts|jsx|mjs)$/, '.js');

      const compile = async (files, entryPath) => {
        const binding = await loadOptimizer();

        const result = binding.transform_modules(
          convertOptions({
            input: files.map((file) => ({ path: file.path, code: file.code })),
            srcDir: 'src/',
            rootDir: '.',
            // The optimizer defaults to `mode: 'lib'`, which silently leaves `$`
            // untouched. `'prod'` is what actually rewrites `$` into QRLs.
            mode: 'prod',
            isServer: false,
            transpileTs: true,
            transpileJsx: true,
            // `smart` is Qwik's default and what a real build uses. It splits each
            // `$` closure into its own module reached through a dynamic
            // `import(...)`, so lazy loading survives — the linked output still
            // imports those chunks lazily, just from data: URLs.
            entryStrategy: { type: 'smart' },
            minify: 'none',
            sourceMaps: false,
          }),
        );

        const diagnostics = result.diagnostics ?? [];
        const errors = diagnostics
          .filter((diagnostic) => diagnostic.category !== 'warning')
          .map(formatDiagnostic);
        if (errors.length) return { errors, entryCode: '', modules: [] };

        const modules = result.modules.map((module) => ({ path: module.path, code: module.code }));
        try {
          const linked = linkModules(modules, toModulePath(entryPath));
          return {
            entryCode: linked.entryCode,
            errors: [],
            warnings: [],
            modules,
            report: linked.report,
            moduleCount: linked.moduleCount,
            lazy: linked.lazy,
          };
        } catch (error) {
          return { errors: [error.message], modules };
        }
      };

      /* ===================================================================
       * 5. Runner — the sandboxed result document
       * -------------------------------------------------------------------
       * The linked entry is handed to an iframe that carries its own import map.
       * The entry is imported by URL so its `default` export is readable, no
       * matter how the user wrote it.
       * ================================================================= */

      /**
       * Escapes `<` as `\u003C` so arbitrary user code can be embedded in an
       * inline script without a closing script tag or an HTML comment opener
       * confusing the HTML parser. Valid in both JS string literals and JSON.
       */
      const embedInScript = (json) => json.replace(/</g, '\\u003C');

      const createResultHtml = (entryCode) => {
        const runtimeImportMap = embedInScript(JSON.stringify(importMap));
        const entryUrl = embedInScript(JSON.stringify(toDataUrl(entryCode)));

        return [
          '<!doctype html>',
          '<html lang="en">',
          '<head>',
          '<meta charset="utf-8" />',
          '<script src="' + qwikLoaderUrl + '"><\/script>',
          '<script type="importmap">' + runtimeImportMap + '<\/script>',
          '<style>',
          'html,body{margin:0;padding:16px;font:15px/1.6 ui-sans-serif,system-ui,sans-serif;color:#1f2430}',
          'body{background:#fff}',
          'button{font:inherit;padding:6px 12px;cursor:pointer}',
          '<\/style>',
          '</head>',
          '<body>',
          '<div id="app"></div>',
          '<script>',
          'const send = (type, args) => parent.postMessage({ source: "qwik-poc", type, args }, "*");',
          'const format = (value) => {',
          '  if (typeof value === "string") return value;',
          '  try { return JSON.stringify(value); } catch { return String(value); }',
          '};',
          'addEventListener("error", (event) => send("error", [event.message]));',
          'addEventListener("unhandledrejection", (event) => send("error", [String(event.reason)]));',
          'for (const level of ["log", "info", "warn", "error"]) {',
          '  const original = console[level].bind(console);',
          '  console[level] = (...args) => { send(level, args.map(format)); original(...args); };',
          '}',
          '<\/script>',
          '<script type="module">',
          'const report = (message) => parent.postMessage({ source: "qwik-poc", type: "error", args: [message] }, "*");',
          'try {',
          '  const { render, _jsxC } = await import("@builder.io/qwik");',
          '  const component = (await import(' + entryUrl + ')).default;',
          '  if (typeof component !== "function") {',
          '    throw new Error("The entry file must `export default` a Qwik component.");',
          '  }',
          // `render(el, Component)` would call jsx(Component, null), and Qwik's jsx
          // reads props.children eagerly, which throws on a null props object.
          // `_jsxC(Component, null, 3, key)` is exactly what the optimizer emits
          // for `<Component />` in the compiled output, so we build the same node.
          '  await render(document.getElementById("app"), _jsxC(component, null, 3, "lJ_0"));',
          '  parent.postMessage({ source: "qwik-poc", type: "ready" }, "*");',
          '} catch (error) {',
          '  report(error && error.message ? error.message : String(error));',
          '}',
          '<\/script>',
          '</body>',
          '</html>',
        ].join('\n');
      };

      /* ===================================================================
       * 6. UI — a tiny multi-file project
       * ================================================================= */

      const STARTER_PROJECT = [
        {
          path: 'src/app.tsx',
          code: [
            "import { component$ } from '@builder.io/qwik';",
            "import { Counter } from './counter';",
            '',
            'export default component$(() => {',
            '  return (',
            '    <main>',
            '      <h1>Multi-file Qwik</h1>',
            '      <p>Three files, compiled and linked in the browser — no server.</p>',
            '      <Counter label="first" />',
            '      <Counter label="second" />',
            '    </main>',
            '  );',
            '});',
            '',
          ].join('\n'),
        },
        {
          path: 'src/counter.tsx',
          code: [
            "import { component$, useSignal } from '@builder.io/qwik';",
            "import { Label } from './components/label';",
            '',
            'export const Counter = component$((props: { label: string }) => {',
            '  const count = useSignal(0);',
            '',
            '  return (',
            '    <p>',
            '      <Label text={props.label} /> — {count.value}',
            '      <button onClick$={() => count.value++}>+1</button>',
            '    </p>',
            '  );',
            '});',
            '',
          ].join('\n'),
        },
        {
          path: 'src/components/label.tsx',
          code: [
            "import { component$ } from '@builder.io/qwik';",
            '',
            'export const Label = component$((props: { text: string }) => {',
            '  return <strong>{props.text}</strong>;',
            '});',
            '',
          ].join('\n'),
        },
      ];

      const NEW_FILE_TEMPLATE = (name) =>
        [
          "import { component$ } from '@builder.io/qwik';",
          '',
          'export const ' +
            name +
            ' = component$(() => {',
          '  return <div>' +
            name +
            '</div>;',
          '});',
          '',
        ].join('\n');

      const statusEl = document.getElementById('status');
      const statusTextEl = document.getElementById('status-text');
      const filesEl = document.getElementById('files');
      const editorEl = document.getElementById('editor');
      const resultEl = document.getElementById('result');
      const compiledEl = document.getElementById('compiled');
      const consoleEl = document.getElementById('console');
      const runButton = document.getElementById('run');

      let files = STARTER_PROJECT.map((file) => ({ ...file }));
      let entryIndex = 0;
      let activeIndex = 0;
      let running = false;

      const setStatus = (state, text) => {
        statusEl.className = 'status ' + state;
        statusTextEl.textContent = text;
      };

      const log = (type, text) => {
        if (consoleEl.querySelector('.empty')) consoleEl.textContent = '';
        const entry = document.createElement('div');
        entry.className = 'entry ' + type;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = type;
        const body = document.createElement('span');
        body.className = 'body';
        body.textContent = text;
        entry.append(tag, body);
        consoleEl.append(entry);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      };

      /** Copies the textarea back into the model before any file switch. */
      const stashEditor = () => {
        const file = files[activeIndex];
        if (file) file.code = editorEl.value;
      };

      const renderFiles = () => {
        filesEl.textContent = '';
        files.forEach((file, index) => {
          const row = document.createElement('div');
          row.className = 'file' + (index === activeIndex ? ' active' : '');

          const entryPicker = document.createElement('input');
          entryPicker.type = 'radio';
          entryPicker.className = 'entry';
          entryPicker.name = 'entry';
          entryPicker.checked = index === entryIndex;
          entryPicker.title = 'entry file';
          entryPicker.addEventListener('change', () => {
            entryIndex = index;
            renderFiles();
          });

          const pathInput = document.createElement('input');
          pathInput.className = 'path';
          pathInput.value = file.path;
          pathInput.spellcheck = false;
          pathInput.addEventListener('focus', () => selectFile(index));
          pathInput.addEventListener('change', () => {
            const next = pathInput.value.trim();
            if (next && files.some((other, i) => i !== index && other.path === next)) {
              row.classList.add('invalid');
              return;
            }
            row.classList.remove('invalid');
            files[index].path = next || files[index].path;
            renderFiles();
          });

          const remove = document.createElement('button');
          remove.className = 'icon';
          remove.type = 'button';
          remove.textContent = '×';
          remove.title = 'remove file';
          remove.disabled = files.length < 2;
          remove.addEventListener('click', () => {
            if (files.length < 2) return;
            files.splice(index, 1);
            if (entryIndex >= files.length) entryIndex = 0;
            if (activeIndex >= files.length) activeIndex = files.length - 1;
            selectFile(activeIndex);
            renderFiles();
          });

          row.append(entryPicker, pathInput, remove);
          filesEl.append(row);
        });

        const add = document.createElement('button');
        add.className = 'add-file';
        add.type = 'button';
        add.textContent = '+ Add file';
        add.addEventListener('click', () => {
          stashEditor();
          const index = files.length + 1;
          const name = 'Component' + index;
          files.push({ path: 'src/component' + index + '.tsx', code: NEW_FILE_TEMPLATE(name) });
          activeIndex = files.length - 1;
          editorEl.value = files[activeIndex].code;
          renderFiles();
        });
        filesEl.append(add);
      };

      const selectFile = (index) => {
        if (index === activeIndex) return;
        stashEditor();
        activeIndex = index;
        editorEl.value = files[index]?.code ?? '';
        renderFiles();
      };

      const validateProject = () => {
        const errors = [];
        const seen = new Set();
        for (const file of files) {
          if (!/\.(tsx|ts|jsx|js)$/.test(file.path)) {
            errors.push('"' + file.path + '" needs a .tsx, .ts, .jsx or .js extension.');
          } else if (!file.path.startsWith('src/')) {
            errors.push('"' + file.path + '" must live under src/.');
          }
          if (seen.has(file.path)) errors.push('Duplicate file "' + file.path + '".');
          seen.add(file.path);
        }
        return errors;
      };

      const renderCompiled = (modules, report) => {
        if (!modules?.length) {
          compiledEl.textContent = '// compilation failed';
          return;
        }
        const parts = [];
        parts.push('// ' + modules.length + ' module(s) emitted by the optimizer.');
        parts.push('// Relative imports are resolved to data: URLs of the linked module.');
        for (const module of modules) {
          parts.push('', '// ' + '='.repeat(76), '// ' + module.path, '// ' + '='.repeat(76));
          const resolutions = report?.get(module.path) ?? [];
          for (const { specifier, target } of resolutions) {
            parts.push('//   ' + specifier + '  →  ' + target);
          }
          parts.push('');
          parts.push(module.code);
        }
        compiledEl.textContent = parts.join('\n');
      };

      const run = async () => {
        if (running) return;
        running = true;
        runButton.disabled = true;
        try {
          stashEditor();

          const invalid = validateProject();
          if (invalid.length) {
            setStatus('failed', 'invalid project');
            for (const message of invalid) log('error', message);
            return;
          }

          const result = await compile(files, files[entryIndex].path);
          renderCompiled(result.modules, result.report);

          if (result.errors.length) {
            setStatus('failed', result.errors.length > 1 ? 'errors' : 'error');
            for (const message of result.errors) log('error', message);
            resultEl.srcdoc = '';
            return;
          }

          setStatus('ready', 'compiler ready · qwik ' + QWIK_VERSION);
          log(
            'info',
            'compiled ' +
              files.length +
              ' file(s) → ' +
              result.moduleCount +
              ' module(s), ' +
              result.lazy +
              ' lazy',
          );
          // Re-assigning `srcdoc` reloads the iframe, so each run starts clean.
          resultEl.srcdoc = createResultHtml(result.entryCode);
        } catch (error) {
          setStatus('failed', 'failed to run');
          log('error', error?.message ?? String(error));
        } finally {
          running = false;
          runButton.disabled = false;
        }
      };

      // messages forwarded from the result iframe
      addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.source !== 'qwik-poc') return;
        if (data.type === 'ready') return;
        for (const arg of data.args ?? []) log(data.type, arg);
      });

      editorEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          run();
        }
        if (event.key === 'Tab') {
          event.preventDefault();
          const { selectionStart, selectionEnd, value } = editorEl;
          editorEl.value = value.slice(0, selectionStart) + '  ' + value.slice(selectionEnd);
          editorEl.selectionStart = editorEl.selectionEnd = selectionStart + 2;
        }
      });

      runButton.addEventListener('click', run);

      document.getElementById('clear').addEventListener('click', () => {
        consoleEl.innerHTML = '<div class="empty">no output</div>';
      });

      for (const tab of document.querySelectorAll('.tabs button')) {
        tab.addEventListener('click', () => {
          for (const other of document.querySelectorAll('.tabs button')) {
            other.classList.toggle('active', other === tab);
          }
          for (const panel of document.querySelectorAll('.tab-panel')) {
            panel.classList.toggle('active', panel.dataset.panel === tab.dataset.tab);
          }
        });
      }

      /* ===================================================================
       * 7. Boot
       * ================================================================= */

      editorEl.value = files[activeIndex].code;
      renderFiles();

      await loadOptimizer()
        .then(() => setStatus('ready', 'compiler ready · qwik ' + QWIK_VERSION))
        .catch((error) => {
          setStatus('failed', 'compiler failed to load');
          log('error', error?.message ?? String(error));
        });

      await run();
    </script>
  </body>
</html>
